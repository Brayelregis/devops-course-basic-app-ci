
name: GitHub Actions Demo

run-name: ${{ github.actor }} is testing out GitHub Actions

on: [push]

jobs:
  Explore-GitHub-Actions:
    runs-on: ubuntu-latest

    steps:
      - name: Premier message
        run: echo "Workflow déclenché ! sur par un événement ${{github.event_name}}"

      - name: Afficher le runner
        run: echo "Job exécuté par ${{ runner.os }} hébergé par Github."

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Lister les fichiers
        run: ls ${{ github.workspace }}

      - name: Afficher le statut
        run: echo "Statut du job : ${{ job.status }}"
